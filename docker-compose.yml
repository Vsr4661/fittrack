services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for photos (stands in for AWS S3 locally).
  # SeaweedFS because MinIO stopped publishing Docker images. Configured only
  # through env vars (no command args) so CI's service container can match it.
  s3:
    image: chrislusf/seaweedfs:4.48
    environment:
      # Local-only credentials (like the Postgres password above), mirrored in .env.example
      AWS_ACCESS_KEY_ID: fittrack
      AWS_SECRET_ACCESS_KEY: fittrack-dev-secret
      S3_BUCKET: fittrack,fittrack-test # dev bucket + the one tests use
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  s3data:
